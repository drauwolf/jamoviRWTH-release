title: Statistical Tests (D6)
name: d6tests
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: CollapseBox
    label: Normal distribution - One Sample
    collapsed: true
    children:
      - type: VariableSupplier
        persistentItems: false
        stretchFactor: 1
        children:
          - type: TargetLayoutBox
            label: Variable
            children:
              - type: VariablesListBox
                name: varnormalones
                maxItemCount: 1
                isTarget: true
      - type: LayoutBox
        margin: large
        children:
          - type: TextBox
            name: normalphaones
            format: number
      - type: LayoutBox
        style: inline
        stretchFactor: 1
        margin: large
        children:
          - type: LayoutBox
            stretchFactor: 1
            margin: large
            children:
              - type: CheckBox
                name: ztest
                style: inline
                verticalAlignment: center
                children:
                  - type: TextBox
                    name: ztestvalue
                    label: 'at test value μ₀ = '
                    format: number
                    enable: (ztest)
          - type: LayoutBox
            stretchFactor: 1
            margin: large
            children:
              - type: TextBox
                name: ztestsigma
                label: 'for known σ² = '
                format: number
                enable: (ztest)
              - type: RadioButton
                name: Twoztest
                optionName: ztestside
                optionPart: twoztest
                label: 'H₀: μ = μ₀ ↔ H₁: μ ≠ μ₀ '
                enable: (ztest)
              - type: RadioButton
                name: Lowerztest
                optionName: ztestside
                optionPart: lowerztest
                label: 'H₀: μ ≥ μ₀ ↔ H₁: μ < μ₀ '
                enable: (ztest)
              - type: RadioButton
                name: Upperztest
                optionName: ztestside
                optionPart: upperztest
                label: 'H₀: μ ≤ μ₀ ↔ H₁: μ > μ₀ '
                enable: (ztest)
              - type: CheckBox
                name: ztestpower
                enable: (ztest)
                children:
                  - type: TextBox
                    name: ztestpowervalue
                    label: 'at value μ = '
                    format: number
                    enable: (ztest)
              - type: CheckBox
                name: ztesttypeIerror
                style: inline
                verticalAlignment: center
                enable: (ztest)
                children:
                  - type: TextBox
                    name: ztesttypeIerrorvalue
                    label: ' at value μ = '
                    format: number
                    enable: (ztest)
              - type: CheckBox
                name: ztesttypeIIerror
                style: inline
                verticalAlignment: center
                enable: (ztest)
                children:
                  - type: TextBox
                    name: ztesttypeIIerrorvalue
                    label: 'at value μ = '
                    format: number
                    enable: (ztest)
              - type: CheckBox
                name: ztestexpdesign
                enable: (ztest)
                children:
                  - type: TextBox
                    name: ztestexpdesignbeta
                    label: 'given probability β* = '
                    format: number
                    enable: (ztest)
                  - type: TextBox
                    name: ztestexpdesigndelta
                    label: 'minimal distance δ₀ = '
                    format: number
                    enable: (ztest)
      - type: LayoutBox
        style: inline
        stretchFactor: 1
        margin: large
        children:
          - type: LayoutBox
            stretchFactor: 1
            margin: large
            children:
              - type: CheckBox
                name: ttest
                style: inline
                verticalAlignment: center
                children:
                  - type: TextBox
                    name: ttestvalue
                    label: 'at test value μ₀ = '
                    format: number
                    enable: (ttest)
          - type: LayoutBox
            stretchFactor: 1
            margin: large
            children:
              - type: RadioButton
                name: Twottest
                optionName: ttestside
                optionPart: twottest
                label: 'H₀: μ = μ₀ ↔ H₁: μ ≠ μ₀ '
                enable: (ttest)
              - type: RadioButton
                name: Lowerttest
                optionName: ttestside
                optionPart: lowerttest
                label: 'H₀: μ ≥ μ₀ ↔ H₁: μ < μ₀ '
                enable: (ttest)
              - type: RadioButton
                name: Upperttest
                optionName: ttestside
                optionPart: upperttest
                label: 'H₀: μ ≤ μ₀ ↔ H₁: μ > μ₀ '
                enable: (ttest)
      - type: LayoutBox
        style: inline
        stretchFactor: 1
        margin: large
        children:
          - type: LayoutBox
            stretchFactor: 1
            margin: large
            children:
              - type: CheckBox
                name: chitestknownmu
                style: inline
                verticalAlignment: center
                children:
                  - type: TextBox
                    name: chitestvalueknownmu
                    label: 'at test value σ₀ = '
                    format: number
                    enable: (chitestknownmu)
          - type: LayoutBox
            stretchFactor: 1
            margin: large
            children:
              - type: TextBox
                name: chitestmu
                label: 'for known μ = '
                format: number
                enable: (chitestknownmu)
              - type: RadioButton
                name: Twochitestknownmu
                optionName: chitestsideknownmu
                optionPart: twochitestknownmu
                label: 'H₀: σ = σ₀ ↔ H₁: σ ≠ σ₀ '
                enable: (chitestknownmu)
              - type: RadioButton
                name: Lowerchitestknownmu
                optionName: chitestsideknownmu
                optionPart: lowerchitestknownmu
                label: 'H₀: σ ≥ σ₀ ↔ H₁: σ < σ₀ '
                enable: (chitestknownmu)
              - type: RadioButton
                name: Upperchitestknownmu
                optionName: chitestsideknownmu
                optionPart: upperchitestknownmu
                label: 'H₀: σ ≤ σ₀ ↔ H₁: σ > σ₀ '
                enable: (chitestknownmu)
      - type: LayoutBox
        style: inline
        stretchFactor: 1
        margin: large
        children:
          - type: LayoutBox
            stretchFactor: 1
            margin: large
            children:
              - type: CheckBox
                name: chitest
                style: inline
                verticalAlignment: center
                children:
                  - type: TextBox
                    name: chitestvalue
                    label: 'at test value σ₀ = '
                    format: number
                    enable: (chitest)
          - type: LayoutBox
            stretchFactor: 1
            margin: large
            children:
              - type: RadioButton
                name: Twochitest
                optionName: chitestside
                optionPart: twochitest
                label: 'H₀: σ = σ₀ ↔ H₁: σ ≠ σ₀ '
                enable: (chitest)
              - type: RadioButton
                name: Lowerchitest
                optionName: chitestside
                optionPart: lowerchitest
                label: 'H₀: σ ≥ σ₀ ↔ H₁: σ < σ₀ '
                enable: (chitest)
              - type: RadioButton
                name: Upperchitest
                optionName: chitestside
                optionPart: upperchitest
                label: 'H₀: σ ≤ σ₀ ↔ H₁: σ > σ₀ '
                enable: (chitest)
