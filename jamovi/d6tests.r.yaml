---
name:  d6tests
title: Statistical Tests (D6)
jrs:   '1.1'

items:
    - name:  ztest
      title: Z-Test
      visible: (ztest && !is.null(varnormalones))
      type: Table
      rows:  0
      columns:
        - name: signlevel
          title: 'α'
          type: number
        - name: statistic
          title: 'Statistic'
          type: number 
          visible: (ztest)
        - name: c
          title: 'c'
          type: number
          visible: (ztest)
        - name: decision
          title: 'Decision rule'
          type: text 
          visible: (ztest)
        - name: power
          title: 'G(μ)'
          type: number
          visible: (ztestpower)
        - name: typeI
          title: 'α(μ)'
          type: number
          visible: (ztesttypeIerror)
        - name: typeII
          title: 'β(μ)'
          type: number
          visible: (ztesttypeIIerror)
        - name: minn
          title: 'n≥'
          type: number
          visible: (ztestexpdesign)

