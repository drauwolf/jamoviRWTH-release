title: Time Series Analysis (A9)
name: a9timeseriesanalysis
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Variable
        children:
          - type: VariablesListBox
            name: var
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Time
        children:
          - type: VariablesListBox
            name: time
            maxItemCount: 1
            isTarget: true
  - type: LayoutBox
    style: inline
    stretchFactor: 1
    margin: large
    children:
      - type: LayoutBox
        stretchFactor: 1
        margin: large
        children:
          - type: Label
            label: Save estimation in the Spreadsheet
            children:
              - type: Output
                name: reg
              - type: Output
                name: movavOS
              - type: Output
                name: movavMS
                children:
                  - type: TextBox
                    name: Ordnung
                    format: string
                    enable: (movavOS || movavMS)
      - type: LayoutBox
        stretchFactor: 1
        margin: large
        children:
          - type: Label
            label: Plot
            children:
              - type: CheckBox
                name: runchart
              - type: CheckBox
                name: addest
                enable: (runchart)