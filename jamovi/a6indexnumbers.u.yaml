title: Index Numbers (A6)
name: a6indexnumbers
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: CollapseBox
    label: Index Numbers
    collapsed: true
    children:
      - type: VariableSupplier
        persistentItems: false
        stretchFactor: 1
        children:
          - type: TargetLayoutBox
            label: Variable
            children:
              - type: VariablesListBox
                name: var
                maxItemCount: 1
                isTarget: true
      - type: LayoutBox
        stretchFactor: 1
        margin: large
        children:
          - type: LayoutBox
            children:
              - type: Output
                name: indexnum
                style: inline
                verticalAlignment: center
                children:
                  - type: TextBox
                    name: k
                    format: number
          - type: Output
            name: growthfac
          - type: Output
            name: growthrate
          - type: Label
            label: "Note: Results are output as new rows in the data set"
  - type: CollapseBox
    label: Price and Quantity Indices
    collapsed: false
    children:
      - type: VariableSupplier
        persistentItems: false
        stretchFactor: 1
        children:
          - type: TargetLayoutBox
            label: Basket at time 0
            children:
              - type: VariablesListBox
                name: basket0
                maxItemCount: 1
                isTarget: true
          - type: TargetLayoutBox
            label: Price at time 0
            children:
              - type: VariablesListBox
                name: price0
                maxItemCount: 1
                isTarget: true
          - type: TargetLayoutBox
            label: Basket at time t
            children:
              - type: VariablesListBox
                name: baskett
                maxItemCount: 1
                isTarget: true
          - type: TargetLayoutBox
            label: Price at time t
            children:
              - type: VariablesListBox
                name: pricet
                maxItemCount: 1
                isTarget: true
      - type: LayoutBox
        style: inline
        stretchFactor: 1
        children:
          - type: LayoutBox
            stretchFactor: 1
            margin: large
            children:
              - type: Label
                label: Price Index
                children:
                  - type: CheckBox
                    name: plas
                  - type: CheckBox
                    name: ppaa
                  - type: CheckBox
                    name: pfi
          - type: LayoutBox
            stretchFactor: 1
            margin: large
            children:
              - type: Label
                label: Quantity Index
                children:
                  - type: CheckBox
                    name: qlas
                  - type: CheckBox
                    name: qpaa
                  - type: CheckBox
                    name: qfi
          - type: LayoutBox
            stretchFactor: 1
            margin: large
            children:
              - type: Label
                label: Value Index
                children:
                  - type: CheckBox
                    name: val
      - type: CheckBox
        name: valBask
