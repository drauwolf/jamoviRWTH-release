---
name:  d6tests
title: Statistical Tests (D6)
menuGroup: Inference
version: '1.0.0'
jas: '1.2'

options:
    - name: data
      type: Data
      
    - name: varnormalones
      title: Variable
      type: Variable
      permitted:
        - numeric
      suggested:
        - continuous

    - name: normalphaones
      title: With significance level α =
      type: Number
      default: 0.05
        
    - name: ztest
      title: Z-Test for μ
      type: Bool
      default: false
      
    - name: ztestvalue
      type: Number
      default: 1
      
    - name: ztestsigma
      type: Number
      default: 0.1
      
    - name: ztestside
      title: ' '
      type: List
      options:
        - title: Two-Sided
          name:  twoztest
        - title: One-Sided lower
          name:  lowerztest
        - title: One-Sided upper
          name:  upperztest
      default: twoztest

    - name: ztestpower
      title: Power function of the Z-Test
      type: Bool
      default: false
      
    - name: ztestpowervalue
      type: Number
      default: 1
      
    - name: ztesttypeIerror
      title: Type I error
      type: Bool
      default: false
      
    - name: ztesttypeIerrorvalue
      type: Number
      default: 1

    - name: ztesttypeIIerror
      title: Type II error
      type: Bool
      default: false
      
    - name: ztesttypeIIerrorvalue
      type: Number
      default: 1

    - name: ztestexpdesign
      title: Experimental design with
      type: Bool
      default: false

    - name: ztestexpdesignbeta
      type: Number
      default: 0.5
      
    - name: ztestexpdesigndelta
      type: Number
      default: 1      

    - name: ttest
      title: t-Test for μ
      type: Bool
      default: false
      
    - name: ttestvalue
      type: Number
      default: 1
      
    - name: ttestside
      title: ' '
      type: List
      options:
        - title: Two-Sided
          name:  twottest
        - title: One-Sided lower
          name:  lowerttest
        - title: One-Sided upper
          name:  upperttest
      default: twottest

    - name: chitestknownmu
      title: χ²-Test for σ
      type: Bool
      default: false
      
    - name: chitestvalueknownmu
      type: Number
      default: 1
      
    - name: chitestmu
      type: Number
      default: 2
      
    - name: chitestsideknownmu
      title: ' '
      type: List
      options:
        - title: Two-Sided
          name:  twochitestknownmu
        - title: One-Sided lower
          name:  lowerchitestknownmu
        - title: One-Sided upper
          name:  upperchitestknownmu
      default: twochitestknownmu

    - name: chitest
      title: χ²-Test for σ
      type: Bool
      default: false
      
    - name: chitestvalue
      type: Number
      default: 1
      
    - name: chitestside
      title: ' '
      type: List
      options:
        - title: Two-Sided
          name:  twochitest
        - title: One-Sided lower
          name:  lowerchitest
        - title: One-Sided upper
          name:  upperchitest
      default: twochitest
      
    - name: varnormalpaired1
      title: Variable
      type: Variable
      permitted:
        - numeric
      suggested:
        - continuous
      
    - name: varnormalpaired2
      title: Variable
      type: Variable
      permitted:
        - numeric
      suggested:
        - continuous

    - name: normalphapaired
      title: With significance level α =
      type: Number
      default: 0.05

