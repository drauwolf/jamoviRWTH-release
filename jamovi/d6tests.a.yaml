      default: false
      
    - name: ztestpairedvalue
      type: Number
      default: 1
      
    - name: ztestpairedsigma1
      type: Number
      default: 1
      
    - name: ztestpairedsigma2
      type: Number
      default: 1
      
    - name: ztestpairedrho
      type: Number
      default: 0.1
      
