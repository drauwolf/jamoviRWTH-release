description: >-
  The package jamoviRWTH contains measures and analyses from the book
  "Grundlagen der Wahrscheinlichkeitsrechnung und Statistik" by E. Cramer and U.
  Kamps (2020). The block "Descriptives" contains the analyses for "Descriptive
  Statistics" corresponding to chapters A1-A9 of the book. The block "Inference"
  contains the  analyses for "Inference Statistics" corresponding to chapters
  D3-D7 of the book. The package jamoviRWTH is designed specifically for
  statistical literacy and teaching at different levels (university and school).
